debianRepository.names=Repositories
name.name=Name
name.desc=The name of the repository
releases.name=Releases
releases.desc=The releases that are in this repository.
architectures.name=Architectures
architectures.desc=A comma separated list of the binary architectures within this distribution and if it contains source for any releases that do not specify their own architectures.
components.name=Components
components.desc=This required field lists the component of a distribution for any releases that do not specify their own.
create.name=Create
overridePriority.name=Override Priority
overridePriority.desc=Override the priority that may (or may not) be provided in packages uploaded into this repository.
overrideSection.name=Override Section
overrideSection.desc=Override the section that may (or may not) be provided in packages uploaded into this repository. If you are going to be uploading packages without sections this MUST be set.
uploadRepository.name=Upload To Remote
uploadToRemoteOnUpdate.name=Upload To Remote On Update
uploadToRemoteOnUpdate.desc=When selected, and a remote repository is specified, the repository will be uploaded when packages are added to it.
origin.name=Origin
origin.desc=This optional field is simply copied into the Release files for any releases that do not specify their own.
suite.name=Suite
suite.desc=This optional field is simply copied into the Release files for any releases that do not specify their own. In Debian it contains names like stable, testing or unstable.
signWith.name=Sign With
signWith.desc=The GPG signing key to use for any releases in this repository that do not specify their own.
shared.name=Shared
shared.desc=When shared, the repository will be publicly available. This may then be used as an Update Source on a Debian installation. The URL at which it is available will be https://[server]/[prefix]/[repositoryName]. 
basicRepositoryView.name=Basic
advancedRepositoryView.name=Advanced
remoteRepository.name=Remote Repository
remoteRepository.desc=When selected, a File Resource that represents an external location to synchronize with. During repository creation, the existing repository will be downloaded as a starting point. From then on, any packages uploaded to this server will then be synchronized with the external location. 